# Serves the production Vite build. Listens on 5173 so the external reverse
# proxy (proxy/nginx.conf → royalautoclub-crm-client-1:5173) needs no changes.
server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames under /assets — cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback; index.html must revalidate so new deploys are picked up.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
