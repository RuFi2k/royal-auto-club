# Local dev stack — modern (Better Auth + MinIO), self-contained dev defaults so
# it runs with no .env. Ports are chosen to avoid the site's infra (5432/9000/9001)
# and other local containers.
#
#   Bring up:  docker compose -f docker-compose.local.yaml up -d --build
#   Server:    http://localhost:3001    Client: http://localhost:5174
#   MinIO:     http://localhost:9002     (console http://localhost:9003)
#   Login:     test@test.com / testtest
services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: car_dealer_crm
    ports:
      - "5433:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app -d car_dealer_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"   # S3 API (browser loads photos from here)
      - "9003:9001"   # Web console
    volumes:
      - minio-local:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/crm-media;
      mc anonymous set download local/crm-media;
      echo 'MinIO bucket ready: crm-media';
      "
    restart: "no"

  server:
    build:
      context: ./car-dealer-crm-server
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_app:devpass@db:5432/car_dealer_crm
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5174
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      # Better Auth
      BETTER_AUTH_SECRET: dev-better-auth-secret-min-32-characters-long
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5174
      # Initial admin (auto-created + approved on boot)
      ADMIN_EMAILS: test@test.com
      ADMIN_PASSWORD: testtest
      # Read-only public API key for the marketing site feed
      PUBLIC_API_KEYS: dev-site-key-please-rotate
      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: crm-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9002/crm-media
      # AUTO.RIA auto-poster — off unless you fill these in
      AUTORIA_USER_ID: ""
      AUTORIA_API_KEY: ""
    ports:
      - "3001:3000"
    volumes:
      - ./car-dealer-crm-server/src:/app/src
      - ./car-dealer-crm-server/prisma:/app/prisma
      - ./car-dealer-crm-server/tsconfig.json:/app/tsconfig.json
      - ./car-dealer-crm-server/package.json:/app/package.json
      - ./car-dealer-crm-server/package-lock.json:/app/package-lock.json

  client:
    build:
      context: ./car-dealer-crm-client
      dockerfile: Dockerfile.dev
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5174:5173"
    volumes:
      - ./car-dealer-crm-client/src:/app/src
      - ./car-dealer-crm-client/public:/app/public
      - ./car-dealer-crm-client/index.html:/app/index.html
      - ./car-dealer-crm-client/vite.config.ts:/app/vite.config.ts
      - ./car-dealer-crm-client/tsconfig.json:/app/tsconfig.json
      - ./car-dealer-crm-client/tsconfig.app.json:/app/tsconfig.app.json
      - ./car-dealer-crm-client/tsconfig.node.json:/app/tsconfig.node.json
      - ./car-dealer-crm-client/package.json:/app/package.json
      - ./car-dealer-crm-client/package-lock.json:/app/package-lock.json

volumes:
  pgdata-local:
  minio-local:
