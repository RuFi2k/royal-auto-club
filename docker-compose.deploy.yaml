# Permanent deploy. Auth = Better Auth (Postgres), storage = MinIO (S3).
# Public exposure is handled by the separate nginx reverse proxy (see ../proxy),
# so no service ports are published here — everything is reached over the
# internal docker network.
#
# Bring up:    docker compose -f docker-compose.deploy.yaml up -d --build
# Update env:  edit .env next to this file
# Logs:        docker compose -f docker-compose.deploy.yaml logs -f
services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: car_dealer_crm
    volumes:
      - pgdata-deploy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app -d car_dealer_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY};
      mc mb --ignore-existing local/${S3_BUCKET};
      mc anonymous set download local/${S3_BUCKET};
      echo 'MinIO bucket ready: ${S3_BUCKET}';
      "
    restart: "no"

  server:
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    build:
      context: ./car-dealer-crm-server
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_app:${DB_PASSWORD}@db:5432/car_dealer_crm
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_API_KEYS: ${PUBLIC_API_KEYS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL}
      AUTORIA_USER_ID: ${AUTORIA_USER_ID}
      AUTORIA_API_KEY: ${AUTORIA_API_KEY}
      AUTORIA_PSP_ID: ${AUTORIA_PSP_ID}
      AUTORIA_DEFAULT_REGION_ID: ${AUTORIA_DEFAULT_REGION_ID}
      AUTORIA_DEFAULT_CITY_ID: ${AUTORIA_DEFAULT_CITY_ID}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    volumes:
      - ./car-dealer-crm-server/src:/app/src
      - ./car-dealer-crm-server/prisma:/app/prisma
      - ./car-dealer-crm-server/tsconfig.json:/app/tsconfig.json
      - ./car-dealer-crm-server/package.json:/app/package.json
      - ./car-dealer-crm-server/package-lock.json:/app/package-lock.json
    restart: unless-stopped

  client:
    # Production static build (nginx on 5173) — VITE_API_URL is baked in at
    # build time, so changing it requires a rebuild, not just a restart.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ./car-dealer-crm-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata-deploy:
  minio-data:
